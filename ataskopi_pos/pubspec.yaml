name: ataskopi_pos
description: "Aplikasi kasir AtasKopi."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  camera: ^0.11.2+1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  image: ^4.12.0
  intl: ^0.20.2
  lucide_icons: ^0.257.0
  path: ^1.9.1
  permission_handler: ^12.0.1
  print_bluetooth_thermal: ^1.2.1
  sqflite: ^2.4.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    # Printed on the selfie strip.
    - assets/logo.png
    - assets/brand/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
